<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PenguinLaw — Who sets the tone the market follows?</title>
<style>
  :root{
    --dark:#0a1830; --mid:#10264a; --blue:#1e4f96; --accent:#3b82f6;
    --white:#ffffff; --soft:#e8eef7; --muted:#9fb3d0; --good:#22c55e;
    --bad:#ef4444; --warn:#f59e0b;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--dark); color:var(--white); min-height:100vh;
  }
  .wrap{max-width:560px; margin:0 auto; padding:20px 16px 64px;}
  header{text-align:center; padding:14px 0 18px;}
  header h1{font-size:24px; letter-spacing:.5px;}
  header p{color:var(--muted); font-size:13px; margin-top:6px;}
  .appdot{display:inline-block; width:8px; height:8px; border-radius:50%;
    background:var(--good); margin-right:6px;}
  .clips{display:flex; gap:10px; justify-content:center; margin:16px 0 22px;}
  .clip-btn{background:var(--mid); color:var(--white); border:1px solid var(--blue);
    border-radius:10px; padding:12px 14px; font-size:14px; cursor:pointer;
    min-width:86px; transition:background .15s;}
  .clip-btn.active{background:var(--blue);}
  .clip-btn:disabled{opacity:.5; cursor:default;}
  .player{margin:12px 0 18px;}
  .player audio{width:100%;}
  .card{background:var(--mid); border:1px solid var(--blue); border-radius:12px;
    padding:16px; margin-bottom:16px;}
  .card h2{font-size:15px; color:var(--accent); margin-bottom:8px;
    text-transform:uppercase; letter-spacing:.6px;}
  .transcript{color:var(--soft); font-size:14px; line-height:1.55;}
  .mood{font-size:14px; line-height:1.6;}
  .seg{display:flex; gap:10px; padding:8px 0; border-bottom:1px solid rgba(255,255,255,.06);}
  .seg:last-child{border-bottom:none;}
  .seg .time{color:var(--muted); font-size:12px; white-space:nowrap; min-width:58px;}
  .seg .body{flex:1;}
  .seg .txt{color:var(--soft); font-size:13px;}
  .seg .reason{color:var(--muted); font-size:12px; margin-top:2px;}
  .pill{display:inline-block; font-size:12px; font-weight:600; padding:2px 9px;
    border-radius:999px; margin-bottom:4px;}
  .pill.bullish{background:rgba(34,197,94,.18); color:var(--good);}
  .pill.bearish{background:rgba(239,68,68,.18); color:var(--bad);}
  .pill.neutral{background:rgba(159,179,208,.2); color:var(--soft);}
  .pill.hesitant{background:rgba(245,158,11,.18); color:var(--warn);}
  .pill.confident{background:rgba(59,130,246,.2); color:var(--accent);}
  .verdict-title{font-size:15px; font-weight:700; margin-bottom:6px;}
  .setter{background:rgba(59,130,246,.12); border:1px solid var(--accent);
    border-radius:8px; padding:10px; margin-top:8px;}
  .note{color:var(--soft); font-size:13px; line-height:1.5;}
  .one-liner{background:linear-gradient(135deg,#1e4f96,#0a1830);
    border:1px solid var(--accent);}
  .meta{color:var(--muted); font-size:12px; text-align:center; margin-top:8px;}
  .footer{text-align:center; color:var(--muted); font-size:12px;
    margin-top:28px; line-height:1.5;}
  .state{text-align:center; color:var(--accent); font-size:14px;
    padding:40px 0;}
  .error{color:var(--bad);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="appdot"></span>PenguinLaw</h1>
    <p>Who sets the tone the market follows?</p>
  </header>

  <div class="clips">
    <button class="clip-btn" data-clip="clip1">Clip 1</button>
    <button class="clip-btn" data-clip="clip2">Clip 2</button>
    <button class="clip-btn" data-clip="clip3">Clip 3</button>
  </div>

  <div class="player" id="player" style="display:none">
    <audio id="audio" controls preload="none"></audio>
  </div>

  <div id="state" class="state">Pick a clip to load its analysis.</div>
  <div id="content" style="display:none">
    <div class="card one-liner">
      <h2>Summary</h2>
      <div id="oneline" class="note"></div>
    </div>
    <div class="card">
      <h2>Tone-setter</h2>
      <div id="verdict" class="note"></div>
    </div>
    <div class="card">
      <h2>Per-segment mood</h2>
      <div id="moods" class="mood"></div>
    </div>
    <div class="card">
      <h2>Transcript</h2>
      <div id="transcript" class="transcript"></div>
    </div>
    <div class="meta" id="meta"></div>
  </div>

  <div class="footer">
    Results from a real pipeline run on this clip. Tone is a signal, not a prediction.
  </div>
</div>

<script>
const APP_NAME = "PenguinLaw";
document.querySelectorAll('.clip-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>loadClip(btn.dataset.clip, btn));
});

let currentClip = null;

function setState(msg, isError){
  const s = document.getElementById('state');
  s.style.display = 'block';
  s.className = 'state' + (isError ? ' error':'');
  s.textContent = msg;
  document.getElementById('content').style.display = 'none';
  document.getElementById('player').style.display = 'none';
}

async function loadClip(clipId, btn){
  document.querySelectorAll('.clip-btn').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  currentClip = clipId;
  setState('Waking up the server, ~30s...');

  const audio = document.getElementById('audio');
  // placeholder audio URL: the /analyze route returns JSON only; we use the
  // real clip file served from /demo_clips/<clip>.wav (static).
  audio.src = '/demo_clips/' + clipId + '.wav';
  document.getElementById('player').style.display = 'block';

  try{
    const r = await fetch('/analyze/' + clipId);
    if(!r.ok){
      const body = await r.json().catch(()=>({}));
      setState('Error: ' + (body.error || r.status), true);
      return;
    }
    const d = await r.json();
    render(d);
  }catch(e){
    setState('Could not reach the server. Try again.', true);
  }
}

function render(d){
  document.getElementById('state').style.display = 'none';
  document.getElementById('content').style.display = 'block';

  // one-line summary
  const v = d.tone_setter || {};
  const setter = v.setter_segment;
  let line = 'No persistent tone shift detected in this clip.';
  if(setter){
    const m = setter.segment.mood;
    line = 'The tone takes a decisive turn to "' + m.sentiment + '" at ' +
      setter.segment.start + 's (' + m.one_line_reason + ').';
  }
  document.getElementById('oneline').textContent = line;

  // verdict card
  let verdictHtml = '<div class="verdict-title">Tone-setter</div>';
  if(setter){
    const m = setter.segment.mood;
    const idx = setter.segment_index;
    verdictHtml += '<div class="setter">Segment ' + (idx+1) +
      ' (starting ' + setter.segment.start + 's) sets the tone: ' +
      '<span class="pill ' + m.sentiment + '">' + m.sentiment + '</span><br>' +
      '<span class="note">' + (m.one_line_reason || '') + '</span></div>';
  }
  verdictHtml += '<div class="note" style="margin-top:8px">' +
    (v.confidence_note || '') + '</div>';
  if(v.followers && v.followers.length){
    verdictHtml += '<div class="note" style="margin-top:6px">Followers: ' +
      v.followers.length + ' segment(s) moving the same way.</div>';
  }
  document.getElementById('verdict').innerHTML = verdictHtml;

  // per-segment moods
  let moodsHtml = '';
  (d.segments||[]).forEach(s=>{
    const m = s.mood || {};
    moodsHtml += '<div class="seg"><div class="time">' +
      Math.round(s.start) + '–' + Math.round(s.end) + 's</div>' +
      '<div class="body">' +
      '<span class="pill ' + m.sentiment + '">' + m.sentiment + '</span>' +
      '<div class="txt">' + (s.text || 'no speech') + '</div>' +
      '<div class="reason">certainty ' + Math.round((m.certainty||0)*100) +
      '% · ' + (m.one_line_reason||'') + '</div></div></div>';
  });
  document.getElementById('moods').innerHTML = moodsHtml;

  document.getElementById('transcript').textContent =
    d.transcript || '(empty transcript)';
  document.getElementById('meta').textContent =
    'Clip ' + d.clip_id + ' · ' + d.duration_sec + 's · ' + APP_NAME;
}
</script>
</body>
</html>
